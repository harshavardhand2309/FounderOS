<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0b0d" />
    <meta
      name="description"
      content="Lvl-Up — AI-powered athlete intelligence: performance insights, shot tracking, and advanced visualizations for every sport you play."
    />
    <title>Lvl-Up — AI-Powered Athlete Intelligence</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- The loading screen shows the crest, so start fetching it during HTML
         parse rather than waiting for React to mount and request it. -->
    <link rel="preload" as="image" href="/assets/Logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Sora + JetBrains Mono are the marketing site's faces. Outfit and Inter
         belong to the analytics dashboard, which is ported from Sportsanalytics
         and asks for them by name (font-display / --font-body, 123 call sites).
         They ride along on this one request rather than a second stylesheet:
         the extra CSS is a few hundred bytes, and the browser only downloads a
         .woff2 once something on screen actually renders in that family — which
         never happens outside the dashboard. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300..900&family=Inter:wght@300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
