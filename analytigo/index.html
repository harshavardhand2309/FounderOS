<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0b0d" />
    <meta
      name="description"
      content="Lvl-Up — AI-powered athlete intelligence: performance insights, shot tracking, and advanced visualizations for every sport you play."
    />
    <title>Lvl-Up — AI-Powered Athlete Intelligence</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- The loading screen shows the crest, so start fetching it during HTML
         parse rather than waiting for React to mount and request it. -->
    <link rel="preload" as="image" href="/assets/Logo.png" />
    <!-- Webfonts are self-hosted (src/styles/fonts.css, files in
         public/assets/fonts). There is deliberately no Google Fonts <link>: that
         was a render-blocking request to a third party on every page load, and
         when it could not be reached the whole site fell back to a system serif.
         Sora + JetBrains Mono are the site's faces; Outfit + Inter belong to the
         analytics dashboard and are only downloaded once something renders in
         them, so the marketing pages never pay for them. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
