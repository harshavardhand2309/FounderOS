# Deploys the AnalytiGo prototype (analytigo/) to GitHub Pages so design
# variants can be tested at a public URL before the site moves to Vercel.
name: Deploy AnalytiGo to GitHub Pages

on:
  push:
    branches: [claude/analyitgo-prototype-updates-w9go7q]
    paths: ['analytigo/**', '.github/workflows/analytigo-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: analytigo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: analytigo/package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install
        working-directory: analytigo
        run: npm ci
      - name: Build
        working-directory: analytigo
        env:
          ANALYTIGO_BASE: /FounderOS/
        run: |
          npm run build
          cp dist/index.html dist/404.html  # SPA fallback for deep links
      - uses: actions/upload-pages-artifact@v3
        with:
          path: analytigo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
